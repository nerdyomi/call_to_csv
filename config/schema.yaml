# What the pipeline extracts and in which column order.
#
# The QUESTIONS come from the real form export (config/form/*.json): key, Bangla question, answer options,
# required flag and the "ask only if ..." rules. To move to a new form version, drop the new export next to
# the old one and change `form:` below. Nothing else needs editing unless a new question needs a hint.

form: config/form/kyc_verification_v65_published.json

# Columns that come from the call system, the file name or manifest.csv, NOT from the audio. They are
# written first, in this order (same as the CEX export).
metadata_columns:
  - Call ID
  - Started at
  - Ended at
  - Duration (seconds)
  - Direction
  - Status
  - Customer
  - Customer ID
  - Phone
  - Customer type
  - Division
  - District
  - Upazila
  - Category
  - Subcategory
  - Disposition
  - Stakeholder type
  - Portfolio
  - Agent
  - Campaign
  - Transferred
  - First call resolution
  - CSAT
  - call_form
  - call_form_version

# Form questions that can never be answered from a call (supplied through manifest.csv instead).
manifest_fields: [loan_id]

# Answers outside the option list are dropped (and listed for review) instead of being kept.
closed_enums: true

# --------------------------------------------------------------------------------------------------
# Per-question control. `hint` is extra guidance shown to the AI next to the question; `type` overrides the
# automatic type (text | number | enum | multi). Add a line here when a question keeps going wrong.
# --------------------------------------------------------------------------------------------------
overrides:
  project_sub_type:
    hint: >-
      Decide from what the farmer says the loan is FOR (a crop, cattle, vegetables, fish, fruit, machinery ...).
      Almost every later question depends on this one, so settle it first.
  agri_activity:
    hint: Only asked when the loan is for something other than farming (project_sub_type = Others).
  farmland:
    hint: >-
      The UNIT the farmer uses to describe the size of his land (decimal/shotok, bigha, katha, acre ...), not an amount.
      Listen for the unit he actually speaks in.
  ownership:
    hint: Which kinds of land he has - his own and/or leased / sharecropped / mortgaged.
  current_landsize:
    hint: >-
      Land he will cultivate for THIS loan, in decimals (shotok). If the farmer speaks in another unit, convert with the
      conversion stated in the call (the decimals_per_<unit> answer) and show the working in the evidence.
  previous_year_landsize:
    hint: Land he cultivated last year, in decimals (shotok). Convert like current_landsize if he speaks in another unit.
  loan_amount:
    hint: Loan amount the farmer wants now, in BDT.
  invest:
    hint: Total cost of the season for the loan crop, in BDT.
  yield:
    hint: Total harvest of the loan crop in MAUND (mon), as the form asks. If he gives kg, divide by 40 and say so in a warning.
  unit_price:
    hint: Selling price per MAUND (BDT).
  number_of_dependents:
    hint: Total number of people in the household INCLUDING the farmer himself/herself (the form asks "total family members").
  number_of_earning_members:
    hint: How many household members earn an income, including the farmer.
  current_loan_count:
    hint: Running loans of the farmer himself/herself. Use 0 when he says he has none.
  current_spouse_loan_count:
    hint: Running loans of the spouse. Use 0 when there are none.
  monthly_expenses:
    hint: Total household expenses per MONTH, in BDT.
  income_from_stipend:
    type: number
  income_from_others:
    type: number

# Applied to every question whose key matches the regex (checked after `overrides`).
hint_patterns:
  - match: '^(decimal|katha|bigha|acre|kora|don|kani|gonda)_(own|lease_mortgage)$'
    hint: >-
      The AMOUNT of land in the unit chosen in `farmland`, exactly as the farmer says it. Do NOT convert it to decimals
      (a separate step does that).
  - match: '^decimals_per_'
    hint: >-
      The conversion stated in the call, e.g. "one bigha is 27 shotok" gives 27. Often the agent asks it and the farmer answers.
  - match: '_land_size$'
    hint: Land used for this crop last season, in decimals (shotok).
  - match: '_yield$'
    hint: Harvest in MAUND (mon), as the form asks.
  - match: '_unit_price$'
    hint: Selling price per MAUND (BDT).
  - match: '^income_from_'
    hint: YEARLY income in BDT. If he only gives a monthly amount, multiply by 12 and add a warning.
