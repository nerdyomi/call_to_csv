# USD per 1M tokens. VERIFY against https://ai.google.dev/gemini-api/pricing before relying on
# these numbers: they are typed in by hand and Google changes prices and model names.
# `audio_input` applies to the audio part of the prompt; `text_input` to the system prompt text.
# Thinking tokens are billed at the `output` rate.

audio_tokens_per_second: 32       # Gemini audio tokenisation (documented: 32 tokens/s)

models:
  gemini-3.8-flash:               # price until 2026-12-31; rises to 1.50 / 7.50 from 2027-01-01
    text_input: 0.75
    audio_input: 0.75             # AUDIO PRICE NOT LISTED on the pricing page: assumed = text. Verify.
    output: 3.75
  gemini-3.6-flash:               # same listed price as 3.8 (until 2026-12-31). Audio price not listed: assumed = text.
    text_input: 0.75
    audio_input: 0.75
    output: 3.75
  gemini-3.5-flash-lite:
    text_input: 0.30
    audio_input: 0.30
    output: 2.50
  gemini-2.5-flash:
    text_input: 0.30
    audio_input: 1.00
    output: 2.50
  gemini-2.5-flash-lite:
    text_input: 0.10
    audio_input: 0.30
    output: 0.40
  gemini-2.5-pro:                 # prompts <= 200k tokens
    text_input: 1.25
    audio_input: 1.25
    output: 10.00

# Shown on the website's API status page. null = not known: look it up in Google AI Studio (aistudio.google.com).
# Free-tier limits are per model and per project (all keys of one project share them) and Google changes them,
# so treat every number here as "verify". rpd = requests per day, rpm = per minute, tpm = tokens per minute.
free_tier:
  gemini-3.8-flash:
    {available: true, rpd: 20, rpm: null, tpm: null, note: "20 requests/day per project seen in real use; a request counts as 1 whatever its size"}
  gemini-3.6-flash:
    {available: true, rpd: 20, rpm: null, tpm: null, note: "20 requests/day per project seen in real use"}
  gemini-3.5-flash-lite:
    {available: null, rpd: null, rpm: null, tpm: null, note: "free-tier limits not checked yet"}
  gemini-2.5-flash:
    {available: false, rpd: null, rpm: null, tpm: null, note: "returned 'no longer available to new users' for new projects"}
  gemini-2.5-flash-lite:
    {available: null, rpd: null, rpm: null, tpm: null, note: "free-tier limits not checked yet"}
  gemini-2.5-pro:
    {available: null, rpd: null, rpm: null, tpm: null, note: "free-tier limits not checked yet"}

# Typical output size per call, used only for the forecast (no API needed).
# Replace with real numbers from output/usage.jsonl after your first runs.
assumed_output_tokens_per_call: 6000

usd_to_bdt: 122
