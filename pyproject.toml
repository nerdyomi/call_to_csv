[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "call-pipeline"
version = "0.1.0"
description = "Call recordings -> structured CEX CSV using Gemini"
requires-python = ">=3.10"
dependencies = ["google-genai>=1.0", "python-dotenv>=1.0", "PyYAML>=6.0", "httpx>=0.27", "mutagen>=1.47"]

[project.scripts]
call-pipeline = "call_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
